<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Scoot</title>
  </head>
  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="container header__container">
        <a class="header__link" href="#">
          <img
            class="header__logo"
            src="./images/scoot.svg"
            alt="A main logo of Website"
            width="108"
            height="29"
          />
        </a>

        <nav class="header__navbar">
          <ul class="header__list">
            <li class="header__item">
              <a class="header__item-link" href="#">About</a>
            </li>
            <li class="header__item">
              <a class="header__item-link" href="#">Location</a>
            </li>
            <li class="header__item">
              <a class="header__item-link" href="#">Careers</a>
            </li>
          </ul>

          <button class="main-btn header__btn">Get Scootin</button>
        </nav>

        <button class="header__hamburger"></button>
      </div>
    </header>

    <!-- MAIN -->

    <main class="main">
      <!-- Hero -->

      <section class="hero">
        <div class="container hero__container">
          <div class="hero__wrapper">
            <h1 class="hero__heading">Scooter sharing made simple</h1>

            <div class="hero__bottom">
              <span class="hero__left-line"></span>
              <p class="hero__desc">
                Scoot takes the hassle out of urban mobility. Our bikes are
                placed in convenient locations in each of our cities. Use our
                app to locate the nearest bike, unlock it with a tap, and you’re
                away!
              </p>

              <span class="hero__right-line"></span>
              <span class="hero__right-direction"></span>

              <button class="main-btn hero__btn">Get Scootin</button>
            </div>
          </div>

          <span class="hero__bottom-line"></span>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer
      style="padding: 48px 0; background-color: pink; margin-top: auto"
    ></footer>

    <script src="./js/script.js"></script>
  </body>
</html>
